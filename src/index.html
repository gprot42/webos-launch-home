<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
  <title>Launch Home</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="webOS.js"></script>
</head>
<body>
  <div id="app">
    <div id="background-layer" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="clock-stack">
        <div id="clock" class="clock"></div>
        <div id="clock-date" class="clock-date"></div>
      </div>
      <div class="top-actions">
        <div id="voice-indicator" class="voice-indicator" hidden aria-hidden="true" role="status" aria-live="polite" aria-label="Listening">
          <span class="voice-indicator-glow" aria-hidden="true"></span>
          <span class="voice-indicator-ai" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
              <path d="M8.2 13.2c.7 1.5 2.1 2.5 3.8 2.5s3.1-1 3.8-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="9.2" cy="10.2" r="1.15" fill="currentColor"/>
              <circle cx="14.8" cy="10.2" r="1.15" fill="currentColor"/>
            </svg>
          </span>
          <span class="voice-indicator-mic" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3.5" width="6" height="11" rx="3"/>
              <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0"/>
              <path d="M12 17v3.2"/>
              <path d="M9 20.2h6"/>
            </svg>
          </span>
          <span class="voice-indicator-label">Listening</span>
        </div>
        <button id="app-settings-btn" class="settings-icon focusable" type="button" aria-label="Settings" data-focus-index="90">
          <svg class="settings-icon-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="launcher">
      <nav id="input-row" class="input-row" aria-label="Inputs"></nav>
      <div id="app-grid-shell" class="app-grid-shell">
        <div class="app-scroll-edge app-scroll-edge-left" aria-hidden="true">
          <span class="app-scroll-badge">
            <svg class="app-scroll-chevron-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <section id="app-grid" class="app-grid" aria-label="Apps"></section>
        <div class="app-scroll-edge app-scroll-edge-right" aria-hidden="true">
          <span class="app-scroll-badge">
            <svg class="app-scroll-chevron-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>
    </main>

    <footer id="music-bar" class="music-bar">
      <div class="music-meta">
        <span class="music-icon" aria-hidden="true">♪</span>
        <span id="track-title" class="track-title"></span>
      </div>
      <div class="music-controls">
        <button id="mute-btn" type="button" class="mute-btn focusable" data-focus-index="800" aria-label="Mute" aria-pressed="false">🔉</button>
        <input id="volume-slider" class="volume-slider focusable" data-focus-index="801" type="range" min="0" max="50" value="35" aria-label="Ambient volume">
      </div>
    </footer>

    <div id="settings-panel" class="settings-panel" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <audio id="ambient-audio" preload="auto" playsinline webkit-playsinline></audio>
  </div>

  <script src="main.js"></script>
</body>
</html>
